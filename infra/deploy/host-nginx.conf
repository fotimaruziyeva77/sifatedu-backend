# Umumiy server: serverdagi (host) nginx uchun Sifat Edu sayti. Nusxa:
#   cp infra/deploy/host-nginx.conf /etc/nginx/sites-available/sifatedu
#   ln -s /etc/nginx/sites-available/sifatedu /etc/nginx/sites-enabled/sifatedu
#   nginx -t && systemctl reload nginx
# HTTPS'ni certbot qo'shadi (bu faylga 443 va sertifikat qatorlarini o'zi yozadi):
#   certbot --nginx --redirect -d sifatedu.uz -d www.sifatedu.uz -d media.sifatedu.uz
# Port (8090) root .env dagi PROXY_PORT bilan bir xil bo'lsin.
server {
    listen 80;
    listen [::]:80;
    server_name sifatedu.uz www.sifatedu.uz media.sifatedu.uz;

    # Admin'da video va fayl yuklash; aniq cheklovlar ichki nginx'da.
    client_max_body_size 210m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # Host o'zgarmasin: media.* dagi imzolangan havolalar shu bilan tekshiriladi.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# Umumiy server: platforma domeni va markazlar subdomenlari (serverdagi host nginx uchun).
# Qo'llanma: docs/saas-domen.md. Fayldagi example.uz ni o'z domeningizga almashtiring.
#   cp infra/deploy/host-nginx-platform.conf /etc/nginx/sites-available/sifatedu-platform
#   ln -s /etc/nginx/sites-available/sifatedu-platform /etc/nginx/sites-enabled/sifatedu-platform
#   nginx -t && systemctl reload nginx
# Port (8090) root .env dagi PROXY_PORT bilan bir xil bo'lsin.
server {
    listen 80;
    listen [::]:80;
    server_name example.uz *.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.uz *.example.uz;

    # Wildcard sertifikat: certbot DNS orqali oladi va yangilaydi.
    ssl_certificate /etc/letsencrypt/live/example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.uz/privkey.pem;

    client_max_body_size 210m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

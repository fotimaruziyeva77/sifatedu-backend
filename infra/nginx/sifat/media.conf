# media.<domen>: fayllar va videolar (SeaweedFS, S3 API) — server bloki ichiga qo'shiladi.
# Imzolangan havolalar (video yuklash, HLS segmentlari, yopiq fayllar) Host bilan tekshiriladi,
# shuning uchun Host o'zgarmasdan uzatiladi. O'chirish va boshqaruv — faqat ichki tarmoqdan:
# bu yerda faqat o'qish, yuklash va CORS so'rovlari.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;

# Video brauzerdan qismlarga bo'lib yuklanadi (VIDEO_PART_SIZE_MB=16).
client_max_body_size 64m;

location / {
    limit_except GET HEAD PUT POST OPTIONS {
        deny all;
    }
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://seaweedfs;
}

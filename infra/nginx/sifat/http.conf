# Ikkala production rejimi uchun umumiy (http darajasi): nginx.prod.conf va nginx.proxy.conf.
# `$forwarded_proto` har rejimning o'z faylida aniqlanadi (to'g'ridan-to'g'ri yoki proksi ortida).
include /etc/nginx/mime.types;
default_type application/octet-stream;

server_tokens off;
sendfile on;
tcp_nopush on;
keepalive_timeout 65;
client_max_body_size 25m;

# Loglarda to'liq so'rov qatori yozilmaydi: query'da imzo va tokenlar bo'lishi mumkin.
log_format main '$remote_addr - [$time_local] "$request_method $uri" $status '
                '$body_bytes_sent $request_time "$http_user_agent"';
access_log /dev/stdout main;
error_log /dev/stderr warn;

gzip on;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml
           application/vnd.apple.mpegurl;

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream frontend {
    zone frontend 64k;
    server frontend:3000 resolve;
    keepalive 32;
}

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
    keepalive 32;
}

upstream seaweedfs {
    zone seaweedfs 64k;
    server seaweedfs:8333 resolve;
    keepalive 16;
}

# Birinchi himoya chizig'i. Aniq limitlar (raqam bo'yicha) DRF'da.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
limit_req_status 429;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 60s;

# Sayt (<domen>): backend, admin, static va frontend — server bloki ichiga qo'shiladi.

# --- Security headerlar ---
# CSP sahifalar uchun Next.js'dan keladi (har so'rovda yangi nonce bilan).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;

# --- Backend ---
location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://backend;
}

location /api/ {
    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://backend;
}

# Uy vazifasi javobi: 5 tagacha fayl, jami 50 MB (backend ham tekshiradi).
location ~ ^/api/v1/homework/[0-9]+/submissions/$ {
    client_max_body_size 55m;
    proxy_read_timeout 120s;
    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://backend;
}

location = /admin/login/ {
    limit_req zone=admin_login burst=5 nodelay;
    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://backend;
}

location /admin/ {
    client_max_body_size 210m;
    proxy_read_timeout 300s;
    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://backend;
}

location /static/ {
    root /srv;
    expires 30d;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# --- Frontend ---
# Nomida hash bor fayllar: Next.js o'zi "immutable" kesh sarlavhasini qo'yadi.
location /_next/static/ {
    proxy_pass http://frontend;
    access_log off;
}

location / {
    proxy_pass http://frontend;
    proxy_buffering off;
}

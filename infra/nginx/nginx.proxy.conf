# Production, boshqa loyihalar bilan umumiy server: 80 va 443 ni serverdagi (host) nginx ushlaydi,
# HTTPS va sertifikat o'sha yerda (certbot --nginx; namuna: infra/deploy/host-nginx.conf). Bu nginx
# faqat 127.0.0.1:PROXY_PORT da, HTTP. Yo'naltirish qoidalari nginx.prod.conf bilan bir xil
# (infra/nginx/sifat/).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Mijoz IP'si va protokoli host nginx'dan olinadi. Bu port faqat 127.0.0.1 da ochiq,
    # shuning uchun sarlavhalar faqat shaxsiy tarmoq manzillaridan qabul qilinadi.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    include /etc/nginx/sifat/http.conf;

    # --- www.<domen> → <domen> ---
    server {
        listen 80;
        server_name ~^www\.(?<apex>.+)$;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 301 https://$apex$request_uri;
    }

    server {
        listen 80;
        server_name ~^media\.;
        include /etc/nginx/sifat/media.conf;
    }

    server {
        listen 80 default_server;
        server_name _;
        include /etc/nginx/sifat/site.conf;
    }
}

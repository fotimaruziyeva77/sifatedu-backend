worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker ichki DNS: konteynerlar qayta yaratilganda IP yangilanadi.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:3000 resolve;
        keepalive 16;
    }

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
        keepalive 16;
    }

    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx tashqi chegarada turadi: mijoz yuborgan X-Forwarded-For'ga ishonilmaydi.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- Backend: API, admin, static ---
        location /api/ {
            proxy_pass http://backend;
        }

        # Uy vazifasi javobi: 5 tagacha fayl, jami 50 MB (backend ham tekshiradi).
        location ~ ^/api/v1/homework/[0-9]+/submissions/$ {
            client_max_body_size 55m;
            proxy_read_timeout 120s;
            proxy_pass http://backend;
        }

        location = /admin/login/ {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://backend;
        }

        # Admin orqali promo video yuklanadi (Django'da 200 MB bilan cheklangan).
        location /admin/ {
            client_max_body_size 210m;
            proxy_read_timeout 300s;
            proxy_pass http://backend;
        }

        # Production'da collectstatic natijasi volume'dan beriladi,
        # local'da (fayl yo'q bo'lsa) Django'ning o'zi beradi.
        location /static/ {
            root /srv;
            try_files $uri @backend_static;
            expires 7d;
            access_log off;
        }

        location @backend_static {
            proxy_pass http://backend;
        }

        # --- Frontend (Next.js) ---
        location / {
            proxy_pass http://frontend;
            # SSR streaming uchun buferlash o'chirilgan.
            proxy_buffering off;
        }
    }
}

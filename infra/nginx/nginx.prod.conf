# Production: TLS, security headerlar, kesh va limitlar.
# Uch nom, bitta Let's Encrypt sertifikati (`certbot --cert-name sifatedu`, infra/deploy/init-cert.sh):
#   <domen>        — sayt (asosiy, default_server)
#   www.<domen>    — asosiy domenga 301
#   media.<domen>  — fayllar va videolar (SeaweedFS, S3 API)
# Domen nomi konfiguratsiyaga yozilmagan: server nomlari prefiks bo'yicha ajratiladi.
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # Loglarda to'liq so'rov qatori yozilmaydi: query'da imzo va tokenlar bo'lishi mumkin.
    log_format main '$remote_addr - [$time_local] "$request_method $uri" $status '
                    '$body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/vnd.apple.mpegurl;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:3000 resolve;
        keepalive 32;
    }

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
        keepalive 32;
    }

    upstream seaweedfs {
        zone seaweedfs 64k;
        server seaweedfs:8333 resolve;
        keepalive 16;
    }

    # Birinchi himoya chizig'i. Aniq limitlar (raqam bo'yicha) DRF'da.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;

    # --- TLS (hamma HTTPS serverlar uchun bitta sertifikat) ---
    ssl_certificate     /etc/letsencrypt/live/sifatedu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sifatedu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- HTTP: faqat sertifikat tekshiruvi va HTTPS'ga yo'naltirish ---
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- www.<domen> → <domen> ---
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^www\.(?<apex>.+)$;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 301 https://$apex$request_uri;
    }

    # --- media.<domen>: fayllar va videolar (SeaweedFS, S3 API) ---
    # Imzolangan havolalar (video yuklash, HLS segmentlari, yopiq fayllar) Host bilan tekshiriladi,
    # shuning uchun Host o'zgarmasdan uzatiladi. O'chirish va boshqaruv — faqat ichki tarmoqdan:
    # bu yerda faqat o'qish, yuklash va CORS so'rovlari.
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^media\.;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Video brauzerdan qismlarga bo'lib yuklanadi (VIDEO_PART_SIZE_MB=16).
        client_max_body_size 64m;

        location / {
            limit_except GET HEAD PUT POST OPTIONS {
                deny all;
            }
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://seaweedfs;
        }
    }

    # --- Sayt ---
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # --- Security headerlar ---
        # CSP sahifalar uchun Next.js'dan keladi (har so'rovda yangi nonce bilan).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;

        # --- Backend ---
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_hide_header Strict-Transport-Security;
            proxy_pass http://backend;
        }

        location /api/ {
            proxy_hide_header Strict-Transport-Security;
            proxy_pass http://backend;
        }

        # Uy vazifasi javobi: 5 tagacha fayl, jami 50 MB (backend ham tekshiradi).
        location ~ ^/api/v1/homework/[0-9]+/submissions/$ {
            client_max_body_size 55m;
            proxy_read_timeout 120s;
            proxy_hide_header Strict-Transport-Security;
            proxy_pass http://backend;
        }

        location = /admin/login/ {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_hide_header Strict-Transport-Security;
            proxy_pass http://backend;
        }

        location /admin/ {
            client_max_body_size 210m;
            proxy_read_timeout 300s;
            proxy_hide_header Strict-Transport-Security;
            proxy_pass http://backend;
        }

        location /static/ {
            root /srv;
            expires 30d;
            add_header Cache-Control "public" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # --- Frontend ---
        # Nomida hash bor fayllar: Next.js o'zi "immutable" kesh sarlavhasini qo'yadi.
        location /_next/static/ {
            proxy_pass http://frontend;
            access_log off;
        }

        location / {
            proxy_pass http://frontend;
            proxy_buffering off;
        }
    }
}

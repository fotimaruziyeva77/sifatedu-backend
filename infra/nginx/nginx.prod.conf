# Production, alohida server: 80 va 443 shu nginx'da, TLS shu yerda tugaydi.
# Uch nom, bitta Let's Encrypt sertifikati (`certbot --cert-name sifatedu`, infra/deploy/init-cert.sh):
#   <domen>        — sayt (asosiy, default_server)
#   www.<domen>    — asosiy domenga 301
#   media.<domen>  — fayllar va videolar (SeaweedFS, S3 API)
# Domen nomi konfiguratsiyaga yozilmagan: server nomlari prefiks bo'yicha ajratiladi.
# Umumiy qismlar: infra/nginx/sifat/ (boshqa loyihalar bilan umumiy serverda — nginx.proxy.conf).
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # Internetga to'g'ridan-to'g'ri qaraydi: protokol — o'ziniki.
    map $scheme $forwarded_proto {
        default $scheme;
    }

    include /etc/nginx/sifat/http.conf;

    # --- TLS (hamma HTTPS serverlar uchun bitta sertifikat) ---
    ssl_certificate     /etc/letsencrypt/live/sifatedu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sifatedu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- HTTP: faqat sertifikat tekshiruvi va HTTPS'ga yo'naltirish ---
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- www.<domen> → <domen> ---
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^www\.(?<apex>.+)$;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 301 https://$apex$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ~^media\.;
        include /etc/nginx/sifat/media.conf;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        include /etc/nginx/sifat/site.conf;
    }
}
